# hyprlock 锁屏配置
# 文档: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    grace = 3                  # 锁屏后 3 秒内按任意键可直接解锁（防误触）
}

background {
    monitor =
    path = /home/amekiri/Pictures/Wallpaper/ComfyUI_00393_.png
    blur_passes = 2
    blur_size = 5
    brightness = 0.8
}

# 时钟
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = sans-serif
    color = rgba(255, 255, 255, 0.9)
    position = 0, 220
    halign = center
    valign = center
}

# 日期
label {
    monitor =
    text = cmd[update:60000] date +"%Y-%m-%d %A"
    font_size = 28
    color = rgba(255, 255, 255, 0.7)
    position = 0, 130
    halign = center
    valign = center
}

# 密码输入框
input-field {
    monitor =
    size = 420, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(0, 0, 0, 0.35)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    # placeholder_text = <span foreground="##ffffff99">输入密码…</span>
    placeholder_text = <span foreground="##ffffff99">Enter Password…</span>
    check_color = rgba(204, 170, 68, 0.8)   # 验证中
    check_color = rgba(204, 170, 68, 0.8)   # 验证中
    fail_color = rgba(204, 68, 68, 0.8)     # 密码错误
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -60
    halign = center
    valign = center
}
