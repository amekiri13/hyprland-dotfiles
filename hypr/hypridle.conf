# hypridle 空闲管理配置
# 文档: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock        # 锁屏命令（防止重复启动）
    before_sleep_cmd = loginctl lock-session     # 休眠前先锁屏
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'   # 唤醒后亮屏
}

# 5 分钟无操作 → 锁屏
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 分钟 → 关显示器
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 自动挂起已禁用（Linux suspend 在此机器上有 bug）
